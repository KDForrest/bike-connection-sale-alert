name: Daily Sales Bike Count Email

on:
  schedule:
    # GitHub's cron scheduler can occasionally delay or silently drop an
    # exact-time trigger (especially on low-activity repos), so instead of
    # betting on two precise daily times, we check in every hour. The
    # Python script itself checks the real Pacific time and only sends
    # when it's actually ~10am there -- every other hourly check-in just
    # exits immediately without emailing.
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  # Lets you manually trigger a run from the GitHub Actions tab to test
  # (manual runs always send, regardless of the time check).
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape and send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python daily_instore_email.py
