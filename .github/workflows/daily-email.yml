name: Daily Sales Bike Count Email

on:
  schedule:
    # Cron always runs in UTC and never shifts for daylight saving, but
    # Pacific Time does -- so we schedule TWO triggers, one for each
    # possible UTC offset, and let the Python script itself check the
    # real Pacific time and skip sending unless it's actually ~10am there.
    - cron: "0 18 * * *"   # 10:00 AM PST (UTC-8, Nov-Mar)
    - cron: "0 17 * * *"   # 10:00 AM PDT (UTC-7, Mar-Nov)
  # Lets you manually trigger a run from the GitHub Actions tab to test
  # (manual runs always send, regardless of the time check).
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape and send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python daily_instore_email.py
